# Make sure to check the documentation at https://goreleaser.com
version: 2 # the goreleaser config version
before:
  hooks:
    - go mod tidy
    # The central config bundle (docs/specs/CENTRAL_BUNDLE.md). It is written
    # outside dist/, which --clean empties, and is picked up by the two
    # extra_files below. The tool runs from the repository root.
    - go run ./tools/compilebundle --out .bundle --version {{ .Tag }} --commit {{ .FullCommit }} --date {{ .CommitDate }}
builds:
    - id: gero
      main: ./main.go
      goos:
        - darwin
        - linux
      goarch:
        - amd64
        - arm64
      binary: gero
      ldflags:
        - -extldflags
        - -static
        - -s -w
        - -X github.com/rancher/orbs-automation/cmd/version.Version={{.Version}}
        - -X github.com/rancher/orbs-automation/cmd/version.Commit={{.Commit}}
        - -X github.com/rancher/orbs-automation/cmd/version.Date={{.Date}}
      flags:
        - -trimpath
      env:
        - CGO_ENABLED=0

archives:
    - id: gero
      ids:
        - gero
      name_template: '{{ .Binary }}_{{ .Os }}_{{ .Arch }}'

# Each archive and the checksum manifest get a keyless Sigstore bundle named
# <file>.sigstore.json, signed by this workflow's identity (the release workflow
# on a version tag). gero doctor self-update refuses a release without them
# (docs/specs/SELF_UPDATE.md).
signs:
  - id: archives
    cmd: cosign
    artifacts: archive
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

release:
  prerelease: auto
  draft: true
  extra_files:
    - glob: .bundle/gero-config-bundle.yaml

checksum:
  name_template: 'checksums.txt'
  extra_files:
    - glob: .bundle/gero-config-bundle.yaml

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
