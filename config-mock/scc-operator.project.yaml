# MOCK config for review. Shape is not final. Synced with config/scc-operator.project.yaml.
# One release line (main + v* tags) serving every Rancher line, no release branches.
# Defaults apply: branches single, tagPattern "v*", lines follow the producer (universal here, since it lists none). requiresPrerelease
# is opted in because stable must come from a commit that already has an RC.
apiVersion: gero/v1alpha1
kind: Project
name: scc-operator
spec:
  repo:
    name: rancher/scc-operator
    owned: true
  release:
    requiresPrerelease: true
  downstream:
    - to: rancher
      method: build-yaml-bump
      params:
        updateKey: defaultSccOperatorImage
        value: "{image}:{tag}"   # an image reference, where most producers write a bare tag
