# MOCK config for review. Shape is not final.
# Unowned and managed by the release team, so all of its config lives centrally,
# and its edge to rancher is observed. Only what the loader supports today: one
# branch per line (the dev tier), and a direct edge to rancher on every line.
# Stretch 2 of docs/specs/CHAIN_TRACING.md changes this: a branch for each stage
# (dev-v2.16, release-v2.16), an edge into rancher-assets from v2.16 on, and the
# edge into rancher only until v2.15. See config/rancher-charts.project.yaml (WIP).
apiVersion: gero/v1alpha1
kind: Project
name: rancher-charts
spec:
  repo:
    name: rancher/charts
    owned: false
    managedBy: release-team
  release:
    branching: perLine
    lines:
      - line: v2.16
        branch: dev-v2.16
      - line: v2.15
        branch: dev-v2.15
      - line: v2.14
        branch: dev-v2.14
      - line: v2.13
        branch: dev-v2.13
      - line: v2.12
        branch: dev-v2.12
  # Conventions every producer follows when opening PRs here (labels default to none).
  pullRequests:
    title: "[{branch}] {package} {chartVersion} {action}"   # action: bump (prerelease) | UnRC (stable)
    branchPrefix: "bot/{source}-"                           # deterministic, no epoch suffix
  updateMethods:
    - name: charts-package-bump
      strategy: chartsPackageBump   # one shared implementation: package.yaml, release.yaml, make steps (not built yet)
      allowedParams:
        - key: package
          description: "The chart package to bump"
      accept:
        when: all                   # RC bumps and stable "UnRC" bumps both
  downstream:
    - to: rancher-assets
      method: read-lock-yaml        # observed: Assets reads the heads of dev and release for each line
      params:
        # The key differs for each line and stage (chart-versions."2.16".upstream-refs.dev.charts.commit),
        # which one edge cannot carry; see docs/design/CONFIG_REVIEW.md.
        updateKey: chart-versions.2.16.upstream-refs.dev.charts.commit
