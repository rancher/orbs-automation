# MOCK config for review. Shape is not final.
# Synced with config/rancher-rancher.project.yaml, plus build-yaml-bump-all, which
# only the mock rancher-charts uses. Not owned (the default), so all config is
# central. This is where Rancher's own line-to-branch mapping lives (the
# RancherLines document has no branches).
apiVersion: gero/v1alpha1
kind: Project
name: rancher
spec:
  finalDestination: true   # releases end here: the other projects ship to it, and it ships to none
  repo:
    name: rancher/rancher
  release:
    branching: perLine
    lines:
      - line: v2.16             # no branch: default branch while "development"
      - line: v2.15
        branch: release/v2.15
      - line: v2.14
        branch: release/v2.14
      - line: v2.13
        branch: release/v2.13
      - line: v2.12
        branch: release/v2.12
  pullRequests:
    title: "[{branch}] Update {source} to {version}"
    branchPrefix: "bot/{source}-"
    labels:
      - status/auto-created
      - team/orbs
  # How rancher takes an update, written once: the producers only say which key
  # they own. Two methods, since what a method accepts is the consumer's call.
  updateMethods:
    - name: build-yaml-bump
      strategy: yamlBump
      with:
        file: build.yaml
      allowedParams:
        - key: updateKey
          description: "The name of the key to update/read in build.yaml file"
        - key: value
          description: "What to write at the key, over {image}, {tag}, {version} and {sourceRepo}"
          default: "{tag}"
      postEdit:
        - run: scripts/generate-buildconfig
    - name: build-yaml-bump-all
      strategy: yamlBump        # the same code, taking release candidates too
      with:
        file: build.yaml
      allowedParams:
        - key: updateKey
          description: "The name of the key to update/read in build.yaml file"
      accept:
        when: all
      postEdit:
        - run: scripts/generate-buildconfig

  images:
    - name: rancher/rancher
    - name: rancher/rancher-agent
    - name: rancher/rancher-server
      since: v2.16
