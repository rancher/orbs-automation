# MOCK config for review. Shape is not final.
# Not owned (the default), so all config is central. This is where Rancher's own
# line-to-branch mapping lives (the RancherLines document has no branches).
apiVersion: gero/v1alpha1
kind: Project
name: rancher-rancher
spec:
  repo:
    name: rancher/rancher
  release:
    branching: perLine
    lines:
      - line: v2.16             # no branch: default branch while "development"
      - line: v2.15
        branch: release/v2.15
      - line: v2.14
        branch: release/v2.14
      - line: v2.13
        branch: release/v2.13
  pullRequests:
    title: "[{branch}] Update {source} to {version}"
    branchPrefix: "bot/{source}-"
    labels:
      - status/auto-created
  # How rancher takes an update, written once: the producers below only say which
  # key they own. Two methods, since what a method accepts is the consumer's call.
  updateMethods:
    - name: build-yaml-bump
      strategy: yamlBump
      with:
        file: build.yaml
      allowedParams:
        - key: updateKey
          description: "The key of build.yaml to read and set"
        - key: value
          description: "What to write: {image}, {tag}, {version} and {sourceRepo} are available"
          default: "{tag}"
      accept:
        when: stable            # accept default
      postEdit:
        - run: scripts/generate-buildconfig
          since: v2.16
        - run: [go, generate, ./pkg/...]
          until: v2.15
    - name: build-yaml-bump-all
      strategy: yamlBump        # the same code, taking release candidates too
      with:
        file: build.yaml
      allowedParams:
        - key: updateKey
          description: "The key of build.yaml to read and set"
      accept:
        when: all
      postEdit:
        - run: scripts/generate-buildconfig
          since: v2.16
        - run: [go, generate, ./pkg/...]
          until: v2.15
