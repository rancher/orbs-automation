# source: lasso.yaml
# lasso: a Go library of the frameworks team (CODEOWNERS: rancher-squad-frameworks), held by Rancher and BRO
# in their go.mod files. Unowned, so gero only observes what is held of it.
# One Stream: a consumer holds a v0.2.* patch, and which one goes with a wrangler release is the version in that
# release's own go.mod: every wrangler Artifact pins this one (config/wrangler.yaml). A v0.3 would be a new Stream and
# Artifact. The module path has no major suffix below v2.
apiVersion: gero/v1alpha2
kind: Project
name: lasso
spec:
  repo: {name: rancher/lasso, managedBy: frameworks-team}
  branches: {layout: single}
---
apiVersion: gero/v1alpha2
kind: Stream
name: lasso-v0-2
refs: {project: lasso}
spec: {scheme: semver, tagPattern: "v0.2.*", universal: true}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: lasso-v0-2-module
refs: {stream: lasso-v0-2}
spec: {kind: gomod, name: github.com/rancher/lasso}
---
# source: rancher-assets.yaml
# rancher-assets: unowned (release team), one branch, lines and stages in the tags.
# It holds a charts commit for each line and stage in its lock file.
apiVersion: gero/v1alpha2
kind: Project
name: rancher-assets
spec:
  aliases: ["assets"]
  repo: {name: rancher/rancher-assets, managedBy: release-team}
  pullRequests: {title: "[{branch}] Update {source} to {version}", branchPrefix: "bot/{source}-", labels: [status/auto-created, team/release-team]}
  branches: {layout: single}
---
apiVersion: gero/v1alpha2
kind: Stream
name: rancher-assets
refs: {project: rancher-assets}
spec:
  scheme: calverLineStage      # gives the stages dev and stable, and the line in the tag
  lines:
    - {line: v2.16}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: assets-image
refs: {stream: rancher-assets}
spec: {kind: image, name: rancher/rancher-assets}
---
apiVersion: gero/v1alpha2
kind: Holding
name: assets-pins-charts
refs: {project: rancher-assets, from: rancher-charts}
spec:
  at:
    file: lock.yaml
    format: yaml
    key: '.chart-versions."{line|trimprefix:v}".upstream-refs.{stage|replace:stable=prod}.charts.commit'
  holds: {kind: commit, stages: [dev, stable]}
---
# source: rancher-charts.yaml
# rancher-charts: unowned (release team), two branches for each line, no tags.
# A chart's releases are versions in a list; one stream for each chart. rancher-backup shown.
apiVersion: gero/v1alpha2
kind: Project
name: rancher-charts
spec:
  aliases: ["charts"]
  repo: {name: rancher/charts, managedBy: release-team}
  pullRequests: {title: "[{branch}] {package} {chartVersion} {action}", branchPrefix: "bot/{source}-"}
  branches:
    layout: perLine
    stages: [dev, stable]
    lines:
      - {line: v2.16, branch: {dev: dev-v2.16, stable: release-v2.16}}
      - {line: v2.15, branch: {dev: dev-v2.15, stable: release-v2.15}}
      - {line: v2.14, branch: {dev: dev-v2.14, stable: release-v2.14}}
      - {line: v2.13, branch: {dev: dev-v2.13, stable: release-v2.13}}
      - {line: v2.12, branch: {dev: dev-v2.12, stable: release-v2.12}}
---
apiVersion: gero/v1alpha2
kind: Stream
name: rancher-charts
refs: {project: rancher-charts}
spec:
  scheme: chartVersion         # CHART+upUPSTREAM; prerelease is read from the part after +up
  lines:
    - {line: v2.17, series: "112.x"}
    - {line: v2.16, series: "111.x"}
    - {line: v2.15, series: "110.x"}
    - {line: v2.14, series: "109.x"}
    - {line: v2.13, series: "108.x"}
    - {line: v2.12, series: "107.x"}
---
# What charts holds of BRO: the two chart URLs in the package file, on the dev branch.
apiVersion: gero/v1alpha2
kind: Holding
name: charts-holds-bro-chart
refs: {project: rancher-charts, artifact: bro-chart}
spec:
  at: {file: packages/rancher-backup/package.yaml, key: url, format: yaml}
  holds: {kind: release, form: "{url}", stage: dev, accept: all}
---
apiVersion: gero/v1alpha2
kind: Holding
name: charts-holds-bro-crd-chart
refs: {project: rancher-charts, artifact: bro-crd-chart}
spec:
  at: {file: packages/rancher-backup/package.yaml, key: '.additionalCharts[0].upstreamOptions.url', format: yaml}
  holds: {kind: release, form: "{url}", stage: dev, accept: all}
---
# What shipping a BRO release into charts also does beyond writing the two URLs.
apiVersion: gero/v1alpha2
kind: Edit
name: charts-bump-rancher-backup
refs: {holding: [charts-holds-bro-chart, charts-holds-bro-crd-chart]}
spec: {strategy: chartsPackageBump, with: {package: rancher-backup}}
