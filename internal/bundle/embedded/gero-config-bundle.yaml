# source: backup-restore-operator.yaml
# backup-restore-operator: owned, one stream for each line, an image and two chart packages.
# It holds the kuberlr image in its chart values, and its chart packages are held by rancher-charts.
apiVersion: gero/v1alpha2
kind: Project
name: backup-restore-operator
spec:
  aliases: ["bro"]
  repo: {name: rancher/backup-restore-operator, managedBy: orbs}
  branches:
    layout: perLine
    lines:
      - {line: v2.16}
      - {line: v2.15, branch: release/v11.x}
      - {line: v2.14, branch: release/v10.x}
      - {line: v2.13, branch: release/v9.x}
      - {line: v2.12, branch: release/v8.x}
---
apiVersion: gero/v1alpha2
kind: Stream
name: backup-restore-operator
refs: {project: backup-restore-operator}
spec:
  scheme: semver
  requiresPrerelease: true
  lines:
    - {line: v2.16, series: "12.x"}
    - {line: v2.15, series: "11.x"}
    - {line: v2.14, series: "10.x"}
    - {line: v2.13, series: "9.x"}
    - {line: v2.12, series: "8.x"}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: bro-image
refs: {stream: backup-restore-operator}
spec: {kind: image, name: rancher/backup-restore-operator}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: bro-chart
refs: {stream: backup-restore-operator}
spec: {kind: file, name: "rancher-backup-{version}.tgz"}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: bro-crd-chart
refs: {stream: backup-restore-operator}
spec: {kind: file, name: "rancher-backup-crd-{version}.tgz"}
---
# What BRO holds: the kuberlr image tag in its chart values.
apiVersion: gero/v1alpha2
kind: Holding
name: bro-holds-kuberlr
refs: {project: backup-restore-operator, artifact: kuberlr-kubectl-image}
spec:
  at: {file: charts/rancher-backup/values.yaml, key: global.kubectl.tag, format: yaml}
  holds: {kind: release, form: "{tag}"}
---
# What BRO holds of wrangler, in go.mod. The module is the same for every minor; each line stays on one minor,
# so a Holding for each minor and the lines that hold it. Shipping a wrangler or lasso release into BRO writes the require line and then tidies, which is the Edit below.
# v2.14 holds 3.4.0 and v2.12 holds 3.2.4: minors with no Stream, because BRO is out of step with Rancher there
# (Rancher holds 3.6 and 3.3). Those lines stay unresolved until BRO moves or a Stream is added.
# cmd/tool is a nested module (v2.14 and later) that requires wrangler and lasso indirectly; `replace` directives
# (cmd/tool replaces BRO with ../../) are not modelled.
apiVersion: gero/v1alpha2
kind: Holding
name: bro-holds-wrangler-3-8
refs: {project: backup-restore-operator, artifact: wrangler-v3-8-module}
spec:
  at:
    - {file: go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: cmd/tool/go.mod, key: github.com/rancher/wrangler/v3, format: gomod, lines: {since: v2.14}}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {since: v2.16}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: bro-holds-wrangler-3-7
refs: {project: backup-restore-operator, artifact: wrangler-v3-7-module}
spec:
  at:
    - {file: go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: cmd/tool/go.mod, key: github.com/rancher/wrangler/v3, format: gomod, lines: {since: v2.14}}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {since: v2.15, until: v2.15}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: bro-holds-wrangler-3-6
refs: {project: backup-restore-operator, artifact: wrangler-v3-6-module}
spec:
  at:
    - {file: go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: cmd/tool/go.mod, key: github.com/rancher/wrangler/v3, format: gomod, lines: {since: v2.14}}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {since: v2.14, until: v2.14}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: bro-holds-wrangler-3-3
refs: {project: backup-restore-operator, artifact: wrangler-v3-3-module}
spec:
  at: {file: go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {since: v2.13, until: v2.13}}
---
# lasso goes with wrangler: every wrangler Artifact pins it, so each Holding above makes a virtual Holding of lasso in the
# same files for the same lines, and shipping a wrangler tag ships the lasso its go.mod requires. This one is for the
# line no wrangler Holding covers: v2.12 holds wrangler 3.2.4, a minor with no Stream, and lasso v0.2.3.
apiVersion: gero/v1alpha2
kind: Holding
name: bro-holds-lasso
refs: {project: backup-restore-operator, artifact: lasso-v0-2-module}
spec:
  at: {file: go.mod, key: github.com/rancher/lasso, format: gomod}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {until: v2.12}}
---
# go.mod is not the whole change: go mod tidy follows in each module the require line was written in, as a commit of
# its own. The Edit follows every Go module BRO holds of another team's library.
apiVersion: gero/v1alpha2
kind: Edit
name: bro-bump-go-modules
refs: {holding: [bro-holds-wrangler-3-8, bro-holds-wrangler-3-7, bro-holds-wrangler-3-6, bro-holds-wrangler-3-3, bro-holds-lasso]}
# Every step and goBump's tidy run with the Go toolchain the branch pins in its go.mod, whatever the engineer's own is:
# generated files made by a newer Go can come out incomplete on an older line (wrangler's code does not run on a newer one).
spec:
  env:
    GOTOOLCHAIN: "{goToolchain}"
  strategy: goBump
  postEdit:
    - {run: [go, generate]}
---
