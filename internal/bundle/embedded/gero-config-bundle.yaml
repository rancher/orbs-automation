  at: {file: build.yaml, key: defaultAssetsImage, format: yaml}
  holds: {kind: release, form: "{image}:{tag}", accept: all, lines: {since: v2.16}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: rancher-follows-charts-branch
refs: {project: rancher, from: rancher-charts}
spec:
  at: {file: package/Dockerfile, key: CHART_DEFAULT_BRANCH, format: dockerfile}
  holds: {kind: branch, lines: {until: v2.15}}
---
# What Rancher holds of wrangler and lasso, in go.mod: the root and its nested modules (pkg/apis, pkg/client,
# pkg/plan, which exists from v2.15). Each line stays on one wrangler minor, so a Holding for each minor and the
# lines that hold it; the locations of one Holding should hold the same version. Observed only: both are unowned.
# `replace` directives (v2.12's pkg/client pins wrangler v3.2.2) are not modelled.
apiVersion: gero/v1alpha2
kind: Holding
name: rancher-holds-wrangler-3-8
acknowledge:
  - rule: locations-differ
    lines: {since: v2.16, until: v2.16}
    reason: on main, pkg/client and pkg/plan are on rc.2 while the root and pkg/apis are on rc.3, and are synced by hand
refs: {project: rancher, artifact: wrangler-v3-8-module}
spec:
  at:
    - {file: go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/apis/go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/client/go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/plan/go.mod, key: github.com/rancher/wrangler/v3, format: gomod, lines: {since: v2.15}}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {since: v2.16}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: rancher-holds-wrangler-3-7
refs: {project: rancher, artifact: wrangler-v3-7-module}
spec:
  at:
    - {file: go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/apis/go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/client/go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/plan/go.mod, key: github.com/rancher/wrangler/v3, format: gomod, lines: {since: v2.15}}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {since: v2.15, until: v2.15}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: rancher-holds-wrangler-3-6
refs: {project: rancher, artifact: wrangler-v3-6-module}
spec:
  at:
    - {file: go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/apis/go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/client/go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {since: v2.14, until: v2.14}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: rancher-holds-wrangler-3-3
refs: {project: rancher, artifact: wrangler-v3-3-module}
spec:
  at:
    - {file: go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/apis/go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
    - {file: pkg/client/go.mod, key: github.com/rancher/wrangler/v3, format: gomod}
  holds: {kind: release, form: "{bareTag}", accept: all, lines: {since: v2.12, until: v2.13}}
---
# lasso has no Holding here: every wrangler Artifact pins it, so each Holding above makes a virtual Holding of lasso in
# the same files for the same lines (the root and pkg/apis, where it is indirect, and pkg/plan from v2.15; pkg/client
# is skipped where it does not require lasso). The wrangler Holdings cover v2.12 to v2.16, so lasso is covered on every line.
# After any change to build.yaml, Rancher regenerates its build config (a step of the consumer, not of the producer).
apiVersion: gero/v1alpha2
kind: Edit
name: rancher-build-yaml-steps
refs: {holding: [rancher-holds-shell, rancher-holds-scc-operator, rancher-holds-assets]}
# The script runs go generate, so it runs in the Go toolchain the branch pins, as the by-hand process forces GOTOOLCHAIN
# to the downstream's pinned toolchain so generated files do not drift between lines.
spec:
  env:
    GOTOOLCHAIN: "{goToolchain}"
  postEdit:
    - {run: scripts/generate-buildconfig}
