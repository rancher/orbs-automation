# Not Rancher: a library released by tag, held by two services in their Dockerfiles. No lines, no stages.
apiVersion: gero/v1alpha2
kind: Project
name: libfoo
spec:
  repo: {name: acme/libfoo, managedBy: orbs}
  branches: {layout: single}
---
apiVersion: gero/v1alpha2
kind: Stream
name: libfoo
refs: {project: libfoo}
spec: {scheme: semver, universal: true}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: libfoo-source
refs: {stream: libfoo}
spec: {kind: file, name: "libfoo-{version}.zip"}
---
apiVersion: gero/v1alpha2
kind: Project
name: svc-a
spec: {repo: {name: acme/svc-a}, branches: {layout: single}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: svc-a-holds-libfoo
refs: {project: svc-a, artifact: libfoo-source}
spec:
  at: {file: Dockerfile, key: LIBFOO_VERSION, format: dockerfile}
  holds: {kind: release, form: "{tag}", accept: all}
---
apiVersion: gero/v1alpha2
kind: Project
name: svc-b
spec: {repo: {name: acme/svc-b}, branches: {layout: single}}
---
apiVersion: gero/v1alpha2
kind: Holding
name: svc-b-holds-libfoo
refs: {project: svc-b, artifact: libfoo-source}
spec:
  at: {file: Dockerfile, key: LIBFOO_VERSION, format: dockerfile}
  holds: {kind: release, form: "{tag}"}
