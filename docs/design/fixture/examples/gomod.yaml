# A Go module we own, tagged with a path prefix in a repo with two modules, and held in a go.mod.
# ob-charts-tool holds the CLI at the root (tags v0.7.1) and helmtools in a subdirectory (tags helmtools/v0.1.2);
# only helmtools is consumed (the CLI requires it by `replace`, which is not modelled). Assets holds v0.1.1. No lines, no stages.
apiVersion: gero/v1alpha2
kind: Project
name: ob-charts-tool
spec:
  repo: {name: rancher/ob-charts-tool, managedBy: orbs}
  branches: {layout: single}
---
apiVersion: gero/v1alpha2
kind: Stream
name: ob-charts-tool-helmtools
refs: {project: ob-charts-tool}
spec: {scheme: semver, tagPattern: "helmtools/v*", universal: true}
---
# A release exists when the tag is on the repo and the version is on the Go module proxy.
apiVersion: gero/v1alpha2
kind: Artifact
name: helmtools-module
refs: {stream: ob-charts-tool-helmtools}
spec: {kind: gomod, name: github.com/rancher/ob-charts-tool/helmtools}
---
# rancher-assets (unowned, release team; see ../rancher-assets.yaml) requires helmtools in its go.mod.
# The tag is helmtools/v0.1.2 and go.mod needs v0.1.2, which is {bareTag}.
apiVersion: gero/v1alpha2
kind: Holding
name: assets-holds-helmtools
refs: {project: rancher-assets, artifact: helmtools-module}
spec:
  at: {file: go.mod, key: github.com/rancher/ob-charts-tool/helmtools, format: gomod}
  holds: {kind: release, form: "{bareTag}", accept: all}
---
# go.mod is not the whole change: go mod tidy follows, and each step is its own commit.
# An example of the strategy only: Assets is observed and gero is not shipping into it yet.
apiVersion: gero/v1alpha2
kind: Edit
name: assets-bump-helmtools
refs: {holding: assets-holds-helmtools}
spec:
  env:
    GOTOOLCHAIN: "{goToolchain}"   # go mod tidy runs in the Go the branch pins, whatever the engineer's own is
  strategy: goBump
