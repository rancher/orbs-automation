# scc-operator: owned, one stream for every line (universal), one image.
kind: Project
name: scc-operator
spec:
  repo: {name: rancher/scc-operator, owned: true}
  branches: {layout: single}
---
kind: Stream
name: scc-operator
refs: {project: scc-operator}
spec:
  scheme: semver
  requiresPrerelease: true
  universal: true            # no series; any release serves every line
---
kind: Artifact
name: scc-operator-image
refs: {stream: scc-operator}
spec: {kind: image, name: rancher/scc-operator}
