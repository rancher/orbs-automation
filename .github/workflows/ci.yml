name: CI Tests

on:
  workflow_call:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.github/CODEOWNERS'
      - 'LICENSE'

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Build, test & validate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check generated mocks are up to date
        run: |
          go generate ./...
          git diff --exit-code
