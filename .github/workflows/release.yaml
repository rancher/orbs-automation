name : Publish artifacts (via goreleaser)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CI: true
  # The central config is this repo's own config/ directory, so every job reads it
  # from the checkout. Not a shell expansion: gero expands $GITHUB_WORKSPACE itself
  # (inside the job container that is /__w/..., where ${{ github.workspace }} would
  # give the host path). Nothing is read until a step runs gero, after checkout.
  GERO_CENTRAL_CONFIG_DIR: "$GITHUB_WORKSPACE/config"

jobs:
  goreleaser:
    runs-on : ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # goreleaser signs with cosign, keylessly, as this workflow
      # (docs/specs/SELF_UPDATE.md).
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/gero_*.tar.gz
            dist/checksums.txt
            .bundle/gero-config-bundle.yaml

      # The bundle is what `gero` fetches when it has no local config, so a release
      # without it, or with a copy that is not the one in checksums.txt, is not
      # published (docs/specs/CENTRAL_BUNDLE.md).
      - name: Check the config bundle is on the release and in the checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          grep -E '^[0-9a-f]{64}  gero-config-bundle\.yaml$' dist/checksums.txt
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | grep -Fx gero-config-bundle.yaml
          mkdir -p "$RUNNER_TEMP/released"
          gh release download "${{ github.ref_name }}" --pattern gero-config-bundle.yaml --dir "$RUNNER_TEMP/released"
          want="$(grep -E '  gero-config-bundle\.yaml$' dist/checksums.txt | cut -d' ' -f1)"
          got="$(sha256sum "$RUNNER_TEMP/released/gero-config-bundle.yaml" | cut -d' ' -f1)"
          test "$want" = "$got"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false
