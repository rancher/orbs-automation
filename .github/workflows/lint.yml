name: golangci-lint
on:
  pull_request:
    paths-ignore:
    - 'docs/**'
    - '*.md'
    - '.gitignore'
    - '.github/CODEOWNERS'
    - 'LICENSE'

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

env:
  CI: true
  # The central config is this repo's own config/ directory, so every job reads it
  # from the checkout. Not a shell expansion: gero expands $GITHUB_WORKSPACE itself
  # (inside the job container that is /__w/..., where ${{ github.workspace }} would
  # give the host path). Nothing is read until a step runs gero, after checkout.
  GERO_CENTRAL_CONFIG_DIR: "$GITHUB_WORKSPACE/config"

jobs:
  golangci:
    name: lint
    runs-on : ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: golangci-lint
        run: golangci-lint run ./...
