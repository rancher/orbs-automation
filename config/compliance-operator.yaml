# yaml-language-server: $schema=https://raw.githubusercontent.com/rancher/orbs-automation/main/generated/jsonschema/gero.v1alpha2.schema.json
# compliance-operator: one release stream for each line, one image. The security team and the Infracloud team own it together;
# managedBy takes one slug, so a joint one stands for both until it can be a list.
# The minor is the Rancher line less ten (v1.6 is v2.16). Lines at v2.11 and before are ended and not in config.
apiVersion: gero/v1alpha2
kind: Project
name: compliance-operator
spec:
  aliases: ["compliance"]
  repo: {name: rancher/compliance-operator, managedBy: security-infracloud}
  branches:
    layout: perLine
    lines:
      - {line: v2.17}                                  # branch omitted: main, while the line is in development
      - {line: v2.16, branch: release/v1.6}
      - {line: v2.15, branch: release/v1.5}
      - {line: v2.14, branch: release/v1.4}
      - {line: v2.13, branch: release/v1.3}
      - {line: v2.12, branch: release/v1.2}
---
apiVersion: gero/v1alpha2
kind: Stream
name: compliance-operator
refs: {project: compliance-operator}
spec:
  scheme: semver
  lines:
    - {line: v2.17, series: "1.7.x"}
    - {line: v2.16, series: "1.6.x"}
    - {line: v2.15, series: "1.5.x"}
    - {line: v2.14, series: "1.4.x"}
    - {line: v2.13, series: "1.3.x"}
    - {line: v2.12, series: "1.2.x"}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: compliance-operator-image
refs: {stream: compliance-operator}
spec: {kind: image, name: rancher/compliance-operator}
---
# What compliance-operator holds: the kuberlr image tag. Through v2.15 the chart is in chart/ and holds it in two places, kept the
# same. The values file holds it beside the repository. Chart.yaml lists the image in helm.sh/images, which is a YAML string
# inside the YAML, so it is read as text: the one line of that list that names the kuberlr image, and the tag after the colon.
apiVersion: gero/v1alpha2
kind: Holding
name: compliance-operator-holds-kuberlr
refs: {project: compliance-operator, artifact: kuberlr-kubectl-image}
spec:
  at:
    - {file: chart/values.yaml, key: global.kubectl.tag, format: yaml}
    - {file: chart/Chart.yaml, key: 'image: rancher/kuberlr-kubectl:(\S+)$', format: regex}
  holds: {kind: release, form: "{tag}", lines: {until: v2.15}}
---
# From v2.16 the charts are in charts/: rancher-compliance, and rancher-compliance-crd, which holds no image. The tag is held in
# one place, the values file of rancher-compliance; its Chart.yaml no longer lists images.
apiVersion: gero/v1alpha2
kind: Holding
name: compliance-operator-holds-kuberlr-v216
refs: {project: compliance-operator, artifact: kuberlr-kubectl-image}
spec:
  at:
    - {file: charts/rancher-compliance/values.yaml, key: global.kubectl.tag, format: yaml}
  holds: {kind: release, form: "{tag}", lines: {since: v2.16}}
