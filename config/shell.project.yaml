# SCC Operator project config
apiVersion: gero/v1alpha1
kind: Project
name: shell
spec:
  repo:
    name: rancher/shell
    owned: true
  release:
    requiresPrerelease: true
    branching: perLine
    lines:
      - line: v2.16             # illustrative series; no branch while "development"
        version: "0.9.x"
      - line: v2.15
        version: "0.8.x"
        branch: release/v2.15   # shell branches are named after the Rancher line
      - line: v2.14
        version: "0.7.x"
        branch: release/v2.14
      - line: v2.13
        version: "0.6.x"
        branch: release/v2.13
      - line: v2.12
        version: "0.5.x"
        branch: release/v2.12
  downstream:
    - to: rancher
      method: build-yaml-bump
      params:
        updateKey: defaultShellVersion
        value: "{image}:{tag}"