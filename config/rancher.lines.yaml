# One document holding the whole set of Rancher lines, newest first.
# Facts about the lines themselves only; no branches (each project maps its own).
# Kubernetes ranges come from the table in the rancher-shell README (April 2026).
apiVersion: gero/v1alpha1
kind: RancherLines
name: rancher
spec:
  lines:
    - id: v2.16
      phase: development        # development | ga | eom | eol
      kubernetes:
        min: "1.35"
        max: "1.37"
    - id: v2.15
      phase: ga
      kubernetes:
        min: "1.34"
        max: "1.36"
    - id: v2.14
      phase: ga
      kubernetes:
        min: "1.33"
        max: "1.35"
    - id: v2.13
      phase: ga
      kubernetes:
        min: "1.32"
        max: "1.34"
    - id: v2.12
      phase: eom
      kubernetes:
        min: "1.31"
        max: "1.33"
