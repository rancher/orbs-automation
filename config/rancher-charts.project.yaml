# `r/charts` repo Project config
apiVersion: gero/v1alpha1
kind: Project
name: rancher-charts
spec:
  repo:
    name: rancher/charts
    owned: false # Will not create PRs for this projects release
    managedBy: release-team
  release:
    branching: perLine
    lines: # TODO: I don't recall how we were going to define the Dev vs Prod branches for each line
      - line: v2.16
        branch: dev-v2.16
      - line: v2.15
        branch: dev-v2.15
      - line: v2.14
        branch: dev-v2.14
      - line: v2.13
        branch: dev-v2.13
      - line: v2.12
        branch: dev-v2.12
  pullRequests:
    title: "[{branch}] {package} {chartVersion} {action}"   # action: bump (prerelease) | UnRC (stable)
    branchPrefix: "bot/{source}-"                           # deterministic, no epoch suffix
  updateMethods:
    - name: charts-package-bump # TODO maybe needs to be per package?
      strategy: chartsPackageBump
      # TODO sort out the layers of with and params it should support
  downstream:
    - to: rancher-assets
      method: read-lock-yaml
      params:
        # TODO something here needs to support line and stage subsittuation in this udpate key
        # That way it reads the right key based on context
        updateKey: ".chart-versions[{line}].upstream-refs[{stage}].charts.commit"
