# yaml-language-server: $schema=https://raw.githubusercontent.com/rancher/orbs-automation/main/generated/jsonschema/gero.v1alpha2.schema.json
# k3s: Kubernetes distribution of SUSE, observed only. Nobody here ships it; consumers hold a release of it in their files
# and `gero repo sync` brings them to the newest stable patch.
# A tag is a git tag, v1.35.9+k3s1, with a release candidate as v1.35.9-rc1+k3s1 and a respin as +k3s2. A line of Rancher stays on
# one Kubernetes minor and takes its patches, so each minor is its own Stream (as wrangler's are), universal, and which line holds
# which minor is written on the consumer's Holdings with `lines`, not here. The minors are those of the ranges in
# rancher.lines.yaml. The Artifact is the binary of the release.
apiVersion: gero/v1alpha2
kind: Project
name: k3s
spec:
  repo: {name: k3s-io/k3s, external: true}
  branches: {layout: single}
---
apiVersion: gero/v1alpha2
kind: Stream
name: k3s-1-31
refs: {project: k3s}
spec: {scheme: semver, tagPattern: "v1.31.*", universal: true}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: k3s-1-31-binary
refs: {stream: k3s-1-31}
spec: {kind: file, name: k3s}
