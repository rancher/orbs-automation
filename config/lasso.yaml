# yaml-language-server: $schema=https://raw.githubusercontent.com/rancher/orbs-automation/main/generated/jsonschema/gero.v1alpha2.schema.json
# lasso: a Go library of the frameworks team (CODEOWNERS: rancher-squad-frameworks), held by Rancher and BRO
# in their go.mod files. Unowned, so gero only observes what is held of it.
# One Stream: a consumer holds a v0.2.* patch, and which one goes with a wrangler release is the version in that
# release's own go.mod: every wrangler Artifact pins this one (config/wrangler.yaml). A v0.3 would be a new Stream and
# Artifact. The module path has no major suffix below v2.
apiVersion: gero/v1alpha2
kind: Project
name: lasso
spec:
  repo: {name: rancher/lasso, managedBy: frameworks-team}
  branches: {layout: single}
---
apiVersion: gero/v1alpha2
kind: Stream
name: lasso-v0-2
refs: {project: lasso}
spec: {scheme: semver, tagPattern: "v0.2.*", universal: true}
---
apiVersion: gero/v1alpha2
kind: Artifact
name: lasso-v0-2-module
refs: {stream: lasso-v0-2}
spec: {kind: gomod, name: github.com/rancher/lasso}
