# `r/r-assets` repo Project config
apiVersion: gero/v1alpha1
kind: Project
name: rancher-assets
spec:
  repo:
    name: rancher/rancher-assets
    owned: false # Will not create PRs for this projects release
    managedBy: release-team
  release:
    branching: perLineTag
    tagScheme: calverLineStage
    lines:
      - line: v2.16
  pullRequests:
    title: "[{branch}] Update {source} to {version}"
    branchPrefix: "bot/{source}-"
    labels:
      - status/auto-created
      - team/release-team
  updateMethods:
    - name: read-lock-yaml
      strategy: yamlBump
      with:
        file: lock.yaml
      allowedParams:
        - key: updateKey
          description: "The name of the key to update/read in lock.yaml file"
  downstream:
    - to: rancher
      method: build-yaml-bump
      params:
        updateKey: defaultAssetsImage
        value: "{image}:{tag}"

  images:
    - name: rancher/rancher-assets
