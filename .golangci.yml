version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - revive
    - unused
    - unparam
    - depguard
    - perfsprint
  settings:
    depguard:
      rules:
        main:
          # Strict: only the allow-list below may be imported. Adding a
          # dependency means updating docs/specs/DEPENDENCY_POLICY.md too.
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/rancher/orbs-automation
            - github.com/spf13/cobra
            - github.com/cli/go-gh
            - github.com/google/go-github
            - github.com/go-git/go-git
            - go.yaml.in/yaml/v3
        # Narrower rule on top of "main" (a file must satisfy both): cmd/ is a
        # thin shell and may only reach internal/ through internal/cli, plus
        # internal/errs for exit-code errors and its own subpackages.
        # See docs/specs/PROJECT_LAYOUT.md sections 2, 3 and 6.
        cmd:
          list-mode: strict
          files:
            - "**/cmd/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/spf13/cobra
            - github.com/rancher/orbs-automation/cmd
            - github.com/rancher/orbs-automation/internal/cli
            - github.com/rancher/orbs-automation/internal/clicfg
            - github.com/rancher/orbs-automation/internal/errs
        # cobra stays in cmd/. internal/cli/ and domain packages must not
        # import it, so the CLI framework can be swapped by touching cmd/ only.
        nocobra:
          list-mode: lax
          files:
            - "!**/cmd/**"
            - "!**/main.go"
            - "!$test"
          deny:
            - pkg: github.com/spf13/cobra
              desc: cobra is only allowed in cmd/ (docs/specs/PROJECT_LAYOUT.md)
        # go-git stays in internal/git/repo, the one place that reads a local
        # repository (docs/specs/PROJECT_LAYOUT.md section 6).
        nogogit:
          list-mode: lax
          files:
            - "!**/internal/git/repo/**"
            - "!$test"
          deny:
            - pkg: github.com/go-git/go-git
              desc: go-git is only allowed in internal/git/repo (docs/specs/PROJECT_LAYOUT.md)
        # os/exec is the escape hatch to the git binary and lives only in
        # internal/git/gitcli, where each use records why go-git cannot do it,
        # and in internal/ghcli, which locates and runs gh for gero doctor
        # (docs/specs/DEPENDENCY_POLICY.md).
        noexec:
          list-mode: lax
          files:
            - "!**/internal/git/gitcli/**"
            - "!**/internal/ghcli/**"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: os/exec is only allowed in internal/git/gitcli and internal/ghcli (docs/specs/DEPENDENCY_POLICY.md)
        # YAML stays in the two loaders, so moving to a new YAML major version
        # touches known files only (docs/specs/DEPENDENCY_POLICY.md).
        noyaml:
          list-mode: lax
          files:
            - "!**/internal/clicfg/**"
            - "!**/internal/config/**"
            - "!$test"
          deny:
            - pkg: go.yaml.in/yaml
              desc: YAML is only allowed in internal/clicfg and internal/config (docs/specs/DEPENDENCY_POLICY.md)
        # go-gh is used for token and host resolution only, through
        # internal/github.GoGh. Its pkg/api is not approved
        # (docs/specs/DEPENDENCY_POLICY.md).
        nogogh:
          list-mode: lax
          files:
            - "!**/internal/github/gogh.go"
            - "!$test"
          deny:
            - pkg: github.com/cli/go-gh
              desc: go-gh is only allowed in internal/github/gogh.go, and only pkg/auth (docs/specs/DEPENDENCY_POLICY.md)
        # go-github types stay inside internal/github; the rest of gero sees
        # narrow consumer-side interfaces (docs/IMPLEMENTATION.md section 3).
        nogogithub:
          list-mode: lax
          files:
            - "!**/internal/github/**"
            - "!$test"
          deny:
            - pkg: github.com/google/go-github
              desc: go-github is only allowed in internal/github (docs/IMPLEMENTATION.md section 3)
        # Commands reach the repository on disk through internal/workspace, so
        # a repo is found and a slug resolved by one rule everywhere
        # (docs/specs/PROJECT_LAYOUT.md section 6, CLI_CONFIG.md section 3a).
        # Loading central config is not denied yet: depguard works per package,
        # and commands will need the internal/config types.
        oneDoor:
          list-mode: lax
          files:
            - "**/internal/cli/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal/git/repo
              desc: commands open repositories through internal/workspace (docs/specs/PROJECT_LAYOUT.md)
        # main.go only calls cmd.Execute().
        entrypoint:
          list-mode: strict
          files:
            - "**/main.go"
          allow:
            - $gostd
            - github.com/rancher/orbs-automation/cmd
        test:
          list-mode: lax
          files:
            - $test
          # depguard requires a non-empty list; lax mode allows everything else.
          allow:
            - $gostd

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
