version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - revive
    - unused
    - unparam
    - depguard
    - perfsprint
  settings:
    depguard:
      rules:
        main:
          # Strict: only the allow-list below may be imported. Adding a
          # dependency means updating docs/specs/DEPENDENCY_POLICY.md too.
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/rancher/orbs-automation
            - github.com/spf13/cobra
            - github.com/cli/go-gh
            - github.com/google/go-github
            # YAML library: add once chosen (docs/specs/DEPENDENCY_POLICY.md open questions).
        test:
          list-mode: lax
          files:
            - $test

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
