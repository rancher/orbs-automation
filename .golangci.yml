version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - revive
    - unused
    - unparam
    - depguard
    - perfsprint
  settings:
    depguard:
      rules:
        main:
          # Strict: only the allow-list below may be imported. Adding a
          # dependency means updating docs/specs/DEPENDENCY_POLICY.md too.
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/rancher/orbs-automation
            - github.com/spf13/cobra
            - github.com/cli/go-gh
            - github.com/google/go-github
            - github.com/go-git/go-git
            - go.yaml.in/yaml/v3
            - golang.org/x/net/html
            - golang.org/x/term
            - charm.land/lipgloss
            - github.com/ergochat/readline
        # Narrower rule on top of "main" (a file must satisfy both): cmd/ is a
        # thin shell and may only reach internal/ through internal/cli, plus
        # internal/platform/errs for exit-code errors and its own subpackages.
        # See docs/specs/PROJECT_LAYOUT.md sections 2, 3 and 6.
        cmd:
          list-mode: strict
          files:
            - "**/cmd/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/spf13/cobra
            - github.com/rancher/orbs-automation/cmd
            - github.com/rancher/orbs-automation/internal/cli
            - github.com/rancher/orbs-automation/internal/platform/clicfg
            - github.com/rancher/orbs-automation/internal/platform/errs
        # cobra stays in cmd/. internal/cli/ and domain packages must not
        # import it, so the CLI framework can be swapped by touching cmd/ only.
        nocobra:
          list-mode: lax
          files:
            - "!**/cmd/**"
            - "!**/main.go"
            - "!$test"
          deny:
            - pkg: github.com/spf13/cobra
              desc: cobra is only allowed in cmd/ (docs/specs/PROJECT_LAYOUT.md)
        # go-git stays in internal/platform/git/repo, the one place that reads a local
        # repository (docs/specs/PROJECT_LAYOUT.md section 6).
        nogogit:
          list-mode: lax
          files:
            - "!**/internal/platform/git/repo/**"
            - "!$test"
          deny:
            - pkg: github.com/go-git/go-git
              desc: go-git is only allowed in internal/platform/git/repo (docs/specs/PROJECT_LAYOUT.md)
        # os/exec lives only in internal/platform/execx, the one place gero starts
        # another program. internal/platform/git/gitcli (each use records why go-git
        # cannot do it) and internal/platform/ghcli (gero doctor) go through it
        # (docs/specs/DEPENDENCY_POLICY.md).
        noexec:
          list-mode: lax
          files:
            - "!**/internal/platform/execx/**"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: os/exec is only allowed in internal/platform/execx; run programs through it (docs/specs/DEPENDENCY_POLICY.md)
        # YAML stays in the loaders, the config engine, the versioned config API and yamledit, so
        # moving to a new YAML major version touches known files only
        # (docs/specs/DEPENDENCY_POLICY.md).
        noyaml:
          list-mode: lax
          files:
            - "!**/internal/platform/clicfg/**"
            - "!**/internal/platform/config/**"
            - "!**/internal/config/loader/**"
            - "!**/internal/apis/**"
            - "!**/internal/platform/yamledit/**"
            - "!$test"
          deny:
            - pkg: go.yaml.in/yaml
              desc: YAML is only allowed in internal/platform/clicfg, internal/platform/config, internal/config/loader, internal/apis and internal/platform/yamledit (docs/specs/DEPENDENCY_POLICY.md)
        # The HTML parser reads the SUSE lifecycle page and nothing else
        # (docs/specs/DEPENDENCY_POLICY.md).
        nohtml:
          list-mode: lax
          files:
            - "!**/internal/lifecycle/**"
            - "!$test"
          deny:
            - pkg: golang.org/x/net/html
              desc: the HTML parser is only allowed in internal/lifecycle (docs/specs/DEPENDENCY_POLICY.md)
        # The terminal checks (is this a TTY, how wide) stay in one package, so
        # the rest of gero asks it and never the library
        # (docs/specs/DEPENDENCY_POLICY.md).
        noxterm:
          list-mode: lax
          files:
            - "!**/internal/cli/termfacts/**"
            - "!$test"
          deny:
            - pkg: golang.org/x/term
              desc: golang.org/x/term is only allowed in internal/cli/termfacts (docs/specs/DEPENDENCY_POLICY.md)
        # Styling stays in one package, so the colors, the downsampling and the
        # lipgloss version are decided in one place
        # (docs/specs/DEPENDENCY_POLICY.md, docs/specs/CLI_OUTPUT.md).
        nolipgloss:
          list-mode: lax
          files:
            - "!**/internal/ui/style/**"
            - "!$test"
          deny:
            - pkg: charm.land/lipgloss
              desc: lipgloss is only allowed in internal/ui/style (docs/specs/DEPENDENCY_POLICY.md)
        # The REPL's line editor stays in one package, behind a small seam
        # (docs/specs/DEPENDENCY_POLICY.md, docs/specs/REPL.md).
        noreadline:
          list-mode: lax
          files:
            - "!**/internal/ui/editor/**"
            - "!$test"
          deny:
            - pkg: github.com/ergochat/readline
              desc: the line editor is only allowed in internal/ui/editor (docs/specs/DEPENDENCY_POLICY.md)
        # Central config is loaded, defaulted and validated only by
        # internal/workspace, so no command can use config that skipped them
        # (docs/specs/WORKSPACE.md, docs/specs/PROJECT_LAYOUT.md).
        oneconfigdoor:
          list-mode: lax
          files:
            - "!**/internal/workspace/**"
            - "!**/internal/config/loader/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal/config/loader
              desc: the config loader is only allowed in internal/workspace; get config from a Workspace (docs/specs/WORKSPACE.md)
        # go-gh is used for token and host resolution only, through
        # internal/platform/github.GoGh. Its pkg/api is not approved
        # (docs/specs/DEPENDENCY_POLICY.md).
        nogogh:
          list-mode: lax
          files:
            - "!**/internal/platform/github/gogh.go"
            - "!$test"
          deny:
            - pkg: github.com/cli/go-gh
              desc: go-gh is only allowed in internal/platform/github/gogh.go, and only pkg/auth (docs/specs/DEPENDENCY_POLICY.md)
        # go-github types stay inside internal/platform/github; the rest of gero sees
        # narrow consumer-side interfaces (docs/specs/GITHUB_ACCESS.md).
        nogogithub:
          list-mode: lax
          files:
            - "!**/internal/platform/github/**"
            - "!$test"
          deny:
            - pkg: github.com/google/go-github
              desc: go-github is only allowed in internal/platform/github (docs/specs/GITHUB_ACCESS.md)
        # Commands reach the repository on disk through internal/workspace, so
        # a repo is found and a slug resolved by one rule everywhere
        # (docs/specs/PROJECT_LAYOUT.md, docs/specs/WORKSPACE.md).
        # Loading central config is denied separately, by oneconfigdoor below.
        oneDoor:
          list-mode: lax
          files:
            - "**/internal/cli/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal/platform/git/repo
              desc: commands open repositories through internal/workspace (docs/specs/PROJECT_LAYOUT.md)
        # A task is one action that commands compose. It reaches the world through
        # domain packages and its own small interface, and knows nothing of the CLI,
        # the terminal or another task, so any command can chain it
        # (docs/specs/PROJECT_LAYOUT.md, Tasks).
        task:
          list-mode: lax
          files:
            - "**/internal/task/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal/cli
              desc: a task does not know about commands; commands compose tasks (docs/specs/PROJECT_LAYOUT.md)
            - pkg: github.com/rancher/orbs-automation/internal/ui
              desc: a task reports through its own sink and never prints (docs/specs/PROJECT_LAYOUT.md)
            - pkg: github.com/rancher/orbs-automation/internal/task
              desc: a task never calls another task; the command or conveyor chains them (docs/specs/PROJECT_LAYOUT.md)
        # The platform layer imports only platform packages and third-party
        # libraries, so nothing low-level depends on what sits above it.
        layer-platform:
          list-mode: lax
          files:
            - "**/internal/platform/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal
              desc: platform packages import only other platform packages (docs/design/LAYERS.md)
            - pkg: github.com/rancher/orbs-automation/cmd
              desc: platform packages do not import the command shell (docs/design/LAYERS.md)
          allow:
            - github.com/rancher/orbs-automation/internal/platform
        # Layers (docs/design/LAYERS.md): imports point down, platform < apis <
        # domain < cli and ui < cmd. A rule is lax with an allow carve-out, so a
        # new package never needs an edit and a stale path cannot quietly stop
        # denying. The config API may use only platform and apis.
        layer-apis:
          list-mode: lax
          files:
            - "**/internal/apis/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal
              desc: the config API may import only internal/platform and internal/apis (docs/design/LAYERS.md)
          allow:
            - github.com/rancher/orbs-automation/internal/platform
            - github.com/rancher/orbs-automation/internal/apis
        # Domain packages (everything under internal/ that is not platform, apis,
        # cli or ui) never import the command layer or the output seam.
        layer-domain:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/platform/**"
            - "!**/internal/apis/**"
            - "!**/internal/cli/**"
            - "!**/internal/ui/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal/cli/
              desc: domain packages do not import commands (docs/design/LAYERS.md)
            - pkg: github.com/rancher/orbs-automation/internal/ui
              desc: domain packages do not import the output seam (docs/design/LAYERS.md)
        # A command does not import another command, except the shared helpers
        # that are not commands. doctor also reuses two commands' checks.
        layer-commands:
          list-mode: lax
          files:
            - "**/internal/cli/**"
            - "!**/internal/cli/doctor/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal/cli/
              desc: a command does not import another command; shared helpers are the exception (docs/design/LAYERS.md)
          allow:
            - github.com/rancher/orbs-automation/internal/cli/identity
            - github.com/rancher/orbs-automation/internal/cli/cdpath
            - github.com/rancher/orbs-automation/internal/cli/termfacts
            - github.com/rancher/orbs-automation/internal/cli/cigate
            - github.com/rancher/orbs-automation/internal/cli/logging
            - github.com/rancher/orbs-automation/internal/cli/buildinfo
        layer-commands-doctor:
          list-mode: lax
          files:
            - "**/internal/cli/doctor/**"
            - "!$test"
          deny:
            - pkg: github.com/rancher/orbs-automation/internal/cli/
              desc: doctor reuses the checks of authstatus and configresolve and the shared helpers only (docs/design/LAYERS.md)
          allow:
            - github.com/rancher/orbs-automation/internal/cli/identity
            - github.com/rancher/orbs-automation/internal/cli/cdpath
            - github.com/rancher/orbs-automation/internal/cli/termfacts
            - github.com/rancher/orbs-automation/internal/cli/cigate
            - github.com/rancher/orbs-automation/internal/cli/logging
            - github.com/rancher/orbs-automation/internal/cli/buildinfo
            - github.com/rancher/orbs-automation/internal/cli/authstatus
            - github.com/rancher/orbs-automation/internal/cli/configresolve
        # main.go only calls cmd.Execute().
        entrypoint:
          list-mode: strict
          files:
            - "**/main.go"
          allow:
            - $gostd
            - github.com/rancher/orbs-automation/cmd
        test:
          list-mode: lax
          files:
            - $test
          # depguard requires a non-empty list; lax mode allows everything else.
          allow:
            - $gostd

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
