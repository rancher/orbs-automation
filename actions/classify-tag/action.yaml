name: classify-tag
description: Report whether a release tag has a prerelease identifier or build metadata, using `gero semver check`

inputs:
  tag:
    description: The tag to classify
    required: false
    default: ${{ github.ref_name }}

outputs:
  HAS_PRERELEASE:
    description: Whether the tag has a prerelease identifier
    value: ${{ steps.classify.outputs.HAS_PRERELEASE }}
  HAS_BUILD_META:
    description: Whether the tag has build metadata
    value: ${{ steps.classify.outputs.HAS_BUILD_META }}

runs:
  using: composite
  steps:
    - name: Classify the tag
      id: classify
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: gero semver check "$TAG" >> "$GITHUB_OUTPUT"
